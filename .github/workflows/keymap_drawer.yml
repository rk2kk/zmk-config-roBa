name: "Draw Keymap"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keymap_drawer.yml"
      - "config/*.keymap"
      - "config/*.json"
      - "keymap-drawer/keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@f9cf9d3677368a7fb1dc505c51b8156fafa66fe2
    permissions:
      contents: write
    with:
      # コミットメッセージを素通しすると多行/引用符で壊れ得る、かつ受け手側シェルへの
      # 注入入口になるため固定文字列にする
      commit_message: "[Draw] Update keymap drawing"
      amend_commit: false
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap-drawer/keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      destination: "both"
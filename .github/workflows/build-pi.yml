name: Build firmware (self-hosted Pi)

# 自宅の Raspberry Pi 5 ランナーでビルドし、成果物を Release に添付する。
# 公開リポジトリのため、PR からは絶対に実行しない（push / 手動のみ）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'boards/**'
      - 'build.yaml'
      - 'zephyr/**'
      - '.github/workflows/build-pi.yml'
      - '.github/scripts/**'

concurrency:
  group: build-pi
  cancel-in-progress: false

# Release へのアップロードにのみ write を使う（ビルド工程には渡さない）
permissions:
  contents: write

jobs:
  build:
    # フォーク側のコピーから誤って起動されないための保険
    if: github.repository == 'rk2kk/zmk-config-roBa'
    runs-on: [self-hosted, linux, arm64, zmk]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build all targets in ZMK container
        run: bash .github/scripts/build-pi.sh

      - name: Attach firmware to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: firmware-latest
        run: python3 .github/scripts/upload-release.py artifacts

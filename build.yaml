# 切り分け用ベースライン: 最小構成(minimal)。
# Studio / cormoran module / PMW3610 RPC を全て外した HID 単体ビルド。
# USB が生える最小構成。犯人を特定する際の極端な opioid 点とする。
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_USB=y -DCONFIG_ZMK_USB_LOGGING=n -DCONFIG_USB_CDC_ACM=n -DCONFIG_CONSOLE=n
    artifact-name: 4_roBa_R_central_minimal

# 切り分けステップ③(進行中): default_layer / OS detection / Settings RPC のみ戻したビルド。
# PMW3610 Studio RPC/Custom Settings はoff(犯人 !== 直近で確定済みのため)
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_DEFAULT_LAYER=y -DCONFIG_ZMK_OS_DETECTION=y -DCONFIG_ZMK_SETTINGS_RPC=y -DCONFIG_ZMK_FAST_KEYMAP=n
    artifact-name: 5_roBa_R_central_step2




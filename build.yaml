# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---

include:
#  - board: xiao_ble
#    shield: roBa_dongle_display dongle_display
#    snippet: studio-rpc-usb-uart
#    artifact-name: zmk_dongle_display

#  - board: xiao_ble
#    shield: roBa_dongle_xiao
#    snippet: studio-rpc-usb-uart
#    artifact-name: zmk_dongle_xiao

#  - board: raytac_mdbt50q_rx
#    shield: roBa_dongle_raytac
#  #  snippet: studio-rpc-usb-uart
#    artifact-name: zmk_dongle_raytac

#  - board: xiao_ble
#    shield: roBa_R_peripheral rgbled_adapter
#    artifact-name: 1_roBa_R_peripheral

  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: 2_roBa_R_central
    cmake-args: -DCONFIG_ZMK_STUDIO=y

# 切り分け用: Studio RPC snippet 無し(NOSTUDIO)。USB HID のみで列挙するか確認するためのビルド
# CDC(Logging/Console) も完全に無効化し、HID インターフェース単体で列挙させる
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    cmake-args: -DCONFIG_ZMK_STUDIO=n -DCONFIG_ZMK_USB=y -DCONFIG_ZMK_USB_LOGGING=n -DCONFIG_USB_CDC_ACM=n -DCONFIG_CONSOLE=n
    artifact-name: 3_roBa_R_central_nostudio

# 切り分け用: 最小構成(minimal)。custom cormoran module / Studio RPC を一括無効化し、
# RAM・スタック圧を最小化したビルド。これで USB が生えるなら要因はモジュール側
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=n
      -DCONFIG_PMW3610_STUDIO_RPC=n -DCONFIG_PMW3610_CUSTOM_SETTINGS=n
      -DCONFIG_ZMK_DEFAULT_LAYER=n -DCONFIG_ZMK_OS_DETECTION=n
      -DCONFIG_ZMK_BLE_MANAGEMENT=n -DCONFIG_ZK_SPLIT_RELAY_EVENT=n
      -DCONFIG_ZMK_SETTINGS_RPC=n -DCONFIG_ZMK_INPUT_STREAM_FEATURE=n
      -DCONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=n -DCONFIG_ZMK_CUSTOM_SETTINGS=n
      -DCONFIG_ZMK_RUNTIME_COMBO=n -DCONFIG_ZMK_RUNTIME_MACRO=n
      -DCONFIG_ZMK_FAST_KEYMAP=n -DCONFIG_ZMK_DEVICE_INFO=n
      -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=n -DCONFIG_ZMK_RUNTIME_SENSOR_ROTATE=n
      -DCONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=n
    artifact-name: 4_roBa_R_central_minimal

#  - board: xiao_ble//zmk
#    shield: roBa_L_central rgbled_adapter
#    snippet: studio-rpc-usb-uart
#    artifact-name: 1_roBa_L_central
    
  - board: xiao_ble//zmk
    shield: roBa_L_peripheral rgbled_adapter
    artifact-name: 2_roBa_L_peripheral

 # reset   
  - board: xiao_ble//zmk
    shield: settings_reset

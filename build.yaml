  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: 2_roBa_R_central
    cmake-args: -DCONFIG_ZMK_STUDIO=y

# 切り分け用: 最小構成(minimal)。cormoran 系 custom module / Studio RPC / Status ADV を
# 一括無効化し RAM・スタック圧を最小化。USB が生えるなら要因はモジュール側
# ※ 下記の設定は roBa_R_central.conf 側でコメント化して行う(シンボルが存在すると
#   ビルド環境によっては undefined symbol 警告で abort するため)
# → 検証ステップ①(PMW3610 Studio RPC 戻し)で再現したため、犯人は
#   "PMW3610 Studio RPC か Custom Settings" のいずれか(または共に)とほぼ確定。
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    cmake-args: -DCONFIG_ZMK_DEFAULT_LAYER=n -DCONFIG_ZMK_OS_DETECTION=n -DCONFIG_ZMK_SETTINGS_RPC=n -DCONFIG_ZMK_INPUT_STREAM_FEATURE=n -DCONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=n -DCONFIG_ZMK_CUSTOM_SETTINGS=n -DCONFIG_ZMK_RUNTIME_COMBO=n -DCONFIG_ZMK_RUNTIME_MACRO=n -DCONFIG_ZMK_FAST_KEYMAP=n -DCONFIG_ZMK_DEVICE_INFO=n -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=n -DCONFIG_ZMK_RUNTIME_SENSOR_ROTATE=n
    artifact-name: 4_roBa_R_central_minimal



#  - board: xiao_ble//zmk

# 安定運用ビルド(DYA Studio 接続用):
#   - Studio RPC + cormoran modules + PMW3610 driver(Studio RPC OFF)
#   - RAM/スタックは縮小値(BLE/INPUT/LOW_PRI/WORKQ 2048, STUDIO_RPC 3072, RX/TX 128)
# 2026-10-20 時点の確認事項:
#   - USB HID はこの構成でも Windows で列挙実績あり(minimal 相当で Code 10 状態)
#   - 詳細な原因はファーム起動早々のクラッシュ疑い(BLE NUS ログは後日診断可)
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: 2_roBa_R_central

# =========================================================
# USB 認識切り分けビルド (2026-10-29)
# 「USB で認識しない」原因は RAM 逼迫(Studio/STUDIO_RPC 系)の疑い。
# 1..3 を OFF → 1 つずつ ON にして USB 列挙を確認する。
#   1: FAST_KEYMAP / 2: SETTINGS_RPC+RUNTIME_MACRO+RUNTIME_COMBO / 3: その他 STUDIO_RPC 系
# A0 = 全部 OFF / A1 = 1 のみ ON / A2 = 1+2 ON / A3 = 全部 ON(現行=2_roBa_R_central)
# =========================================================
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: usb_A0_all_off
    cmake-args: >-
      -DCONFIG_ZMK_FAST_KEYMAP=n
      -DCONFIG_ZMK_SETTINGS_RPC=n
      -DCONFIG_ZMK_RUNTIME_MACRO=n
      -DCONFIG_ZMK_RUNTIME_COMBO=n
      -DCONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=n
      -DCONFIG_ZMK_OS_DETECTION_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=n
      -DCONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n
      -DCONFIG_ZMK_SETTINGS_RPC_STUDIO=n
      -DCONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=n
      -DCONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=n
      -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=n
      -DCONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=n
      -DCONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=n
      -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=n

  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: usb_A1_fastkeymap
    cmake-args: >-
      -DCONFIG_ZMK_SETTINGS_RPC=n
      -DCONFIG_ZMK_RUNTIME_MACRO=n
      -DCONFIG_ZMK_RUNTIME_COMBO=n
      -DCONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=n
      -DCONFIG_ZMK_OS_DETECTION_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=n
      -DCONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n
      -DCONFIG_ZMK_SETTINGS_RPC_STUDIO=n
      -DCONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=n
      -DCONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=n
      -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=n
      -DCONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=n
      -DCONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=n
      -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=n

  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: usb_A2_settings
    cmake-args: >-
      -DCONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=n
      -DCONFIG_ZMK_OS_DETECTION_STUDIO_RPC=n
      -DCONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=n
      -DCONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n
      -DCONFIG_ZMK_SETTINGS_RPC_STUDIO=n
      -DCONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=n
      -DCONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=n
      -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=n

# 安定運用ビルド(DYA Studio 接続用):
#   - Studio RPC + cormoran modules + PMW3610 driver(Studio RPC OFF)
#   - RAM/スタックは縮小値(BLE/INPUT/LOW_PRI/WORKQ 2048, STUDIO_RPC 3072, RX/TX 128)
# 2026-10-20 時点の確認事項:
#   - USB HID はこの構成でも Windows で列挙実績あり(minimal 相当で Code 10 状態)
#   - 詳細な原因はファーム起動早々のクラッシュ疑い(BLE NUS ログは後日診断可)
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: 2_roBa_R_central

# =========================================================
# USB 認識検証 (2026-10-29)
# RAM 63% と逼迫なし(7d11dc7 実測)。過去診断で snippet(studio-rpc-usb-uart)
# が追加する USB CDC デバイスが Windows の列挙(Code 10)を壊す記録があるため、
# snippet なしで USB HID が復活するか検証する。
# ※ Studio は BLE 経由で引き続き利用可(conf 側の CONFIG_ZMK_STUDIO=y は維持)
# =========================================================
  - board: xiao_ble//zmk
    shield: roBa_R_central rgbled_adapter
    artifact-name: usb_nosnippet




